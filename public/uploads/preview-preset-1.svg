<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#F9F8F3"/>
  <rect x="50" y="50" width="700" height="500" fill="#1C1B18" rx="16"/>
  <!-- Tone Grid Mock -->
  <rect x="90" y="90" width="300" height="420" fill="#A37D4C" opacity="0.85" rx="8"/>
